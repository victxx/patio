<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patio Radio — first UI test</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; background: #181818; color: #f4f0e8; }
      main { box-sizing: border-box; width: min(680px, 100%); margin: auto; padding: 12vh 24px; }
      .card { border: 1px solid #5e594d; background: #24231f; padding: 28px; box-shadow: 8px 8px #0d0d0d; }
      .eyebrow { color: #d5a94c; letter-spacing: .16em; font-size: .72rem; }
      h1 { margin: 8px 0 4px; font-size: clamp(2.2rem, 8vw, 4rem); font-weight: 500; }
      p { color: #bcb7ab; line-height: 1.5; }
      .dial { display: flex; gap: 12px; align-items: center; margin: 32px 0 20px; }
      button { border: 0; padding: 13px 18px; background: #d5a94c; color: #17130b; font-weight: 700; cursor: pointer; }
      button:hover { background: #f1c96e; }
      .status { border-top: 1px solid #5e594d; padding-top: 16px; color: #d5a94c; }
      small { color: #777269; }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-label="Patio radio test">
        <div class="eyebrow">PAT.IO / FIRST UI TEST</div>
        <h1>Patio Radio</h1>
        <p>A very small first attempt at a station screen. No live stream yet — just a place to start.</p>
        <div class="dial">
          <button id="tune">Tune in</button>
          <span id="frequency">104.2 FM</span>
        </div>
        <div class="status" id="status">Signal waiting for a station.</div>
        <p><small>prototype 0.0.1 · audio transport comes later</small></p>
      </section>
    </main>
    <script>
      const button = document.querySelector('#tune');
      const status = document.querySelector('#status');
      button.addEventListener('click', () => {
        const tunedIn = button.dataset.tuned === 'yes';
        button.dataset.tuned = tunedIn ? 'no' : 'yes';
        button.textContent = tunedIn ? 'Tune in' : 'Tune out';
        status.textContent = tunedIn ? 'Signal connected. Waiting for audio.' : 'Signal waiting for a station.';
      });
    </script>
  </body>
</html>
