name: transport

on:
  push:
    branches: [main]
    paths: ["transport/**", ".github/workflows/transport.yml"]
  pull_request:
    paths: ["transport/**", ".github/workflows/transport.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transport
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: transport/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
